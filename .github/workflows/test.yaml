name: second workflow
on: [workflow_dispatch, push]
jobs:
  repocheck:
   runs-on: ubuntu-latest
   steps:
     - name: Get code
       uses: actions/checkout@v3
     - name: install node
       uses: actions/setup-node@v3
       with:
        node-version: '18'
     - name: install dependencies
       run: npm ci 
     - name: tests
       run: npm test

       
